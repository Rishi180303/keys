name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: sign in to aws as the deploy role
        if: github.event_name == 'push' && vars.SITE_BUCKET != '' && vars.CLOUDFRONT_ID != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: publish the site behind cloudfront
        if: github.event_name == 'push' && vars.SITE_BUCKET != '' && vars.CLOUDFRONT_ID != ''
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          CLOUDFRONT_ID: ${{ vars.CLOUDFRONT_ID }}
        run: |
          aws s3 sync dist/ "s3://$SITE_BUCKET/app/" --delete --exclude index.html --cache-control "max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$SITE_BUCKET/app/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_ID" --paths "/index.html" "/"

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: build the train and serve images
        run: |
          docker build --provenance=false --target train -t keys:train .
          docker build --provenance=false --target serve -t keys:serve .
      - name: sign in to aws as the deploy role
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: sign in to ecr
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: push both images tagged with the commit
        if: github.event_name == 'push'
        env:
          REPOSITORY: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
        run: |
          for target in train serve; do
            docker tag "keys:$target" "$REPOSITORY:${GITHUB_SHA::7}-$target"
            docker push "$REPOSITORY:${GITHUB_SHA::7}-$target"
          done

  plan:
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/main init -input=false
      - run: terraform -chdir=infra/main validate
      - name: plan what applying this commit's images would change
        env:
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}
        run: terraform -chdir=infra/main plan -input=false -lock-timeout=120s -var "image_tag=${GITHUB_SHA::7}"
