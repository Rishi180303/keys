[project]
name = "keys"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["polars>=1.0", "numpy>=2.0", "torch>=2.5", "mlflow>=2.15"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keys"]
